name: build-and-test
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
      - name: Install
        run: npm ci
      - name: Create .env
        # The tests and the app both read RINGCENTRAL_ENGAGE_VERIFY_TOKEN through dotenv.
        run: cp .env.sample .env
      - name: Test
        run: npm test
        env:
          CI: 'true'
